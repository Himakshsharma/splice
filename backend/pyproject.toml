[project]
name = "splice-backend"
version = "1.0.0"
description = "SPLICE API — AI-assisted automatic jump-cut video editing"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 130
extend-exclude = ["tmp", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ffmpeg: needs ffmpeg/ffprobe on PATH",
    "whisper: downloads/runs a real Whisper model (slow; opt-in with SPLICE_RUN_WHISPER=1)",
]
filterwarnings = ["ignore::DeprecationWarning"]
